<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Rich Saffron to Vibrant Sunset Orange -->
    <linearGradient id="df-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Tag Body Gradient: Pure Brilliant White -->
    <linearGradient id="df-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF7ED" />
    </linearGradient>

    <!-- Rupee Text Gradient -->
    <linearGradient id="df-rupee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <filter id="df-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#df-bg)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Center Deal Tag with Drop Shadow -->
  <g filter="url(#df-shadow)">
    <!-- Slanted Modern Price Tag Shape -->
    <path 
      d="M21 13 
         h15 
         c1.6 0 3.1 0.6 4.2 1.8 
         l12 12 
         c2.3 2.3 2.3 6.1 0 8.5 
         l-12 12 
         c-2.3 2.3-6.1 2.3-8.5 0 
         l-12-12 
         C18.6 34.1 18 32.6 18 31 
         V16 
         c0-1.7 1.3-3 3-3 Z" 
      fill="url(#df-tag)" 
    />

    <!-- Tag String Eyelet / Hole -->
    <circle cx="26" cy="21" r="3.2" fill="#EA580C" />

    <!-- Indian Rupee Symbol (₹) -->
    <text 
      x="35" 
      y="38" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="20" 
      font-weight="900" 
      fill="url(#df-rupee)" 
      text-anchor="middle"
    >₹</text>
  </g>
</svg>
